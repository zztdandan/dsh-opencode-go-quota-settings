name: Release

# Push a version bump to master; this workflow publishes it once, tags the
# commit, and creates a GitHub Release. Re-runs are idempotent: an already
# published version is skipped.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing support
        run: npm install -g npm@^11.15.0
      - name: Validate manifest
        run: node scripts/validate.mjs
      - name: Resolve version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is new — will publish"
          fi
      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Tag and create GitHub Release
        if: steps.version.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists — keeping it"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists — keeping it"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
